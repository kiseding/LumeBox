# 鸿蒙（HarmonyOS）出包：Windows 托管 runner，不装 DevEco Studio。
#
# 参考 kiseding/koyze 的 build-harmonyos-online.yml，但针对本仓库做了三处调整。
#
# 1) 为什么是 Windows + 华为「命令行工具」
#    鸿蒙 Flutter fork（atomgit.com/oh-flutter/flutter_flutter）给 Windows 宿主
#    提供完整的一套定制工件：定制 Dart SDK（带 ohos 补丁）、三档 har、patched_sdk。
#    华为 Command Line Tools 里带了 node / ohpm / hvigor / SDK，装上就能脱离
#    DevEco Studio 出包。CLT 的 macOS 版要登录华为开发者账号才能下载，CI 拿不到，
#    所以这里固定 Windows。CLT 由 kiseding/koyze 的 Release 分卷提供（3 个 part
#    共 2.6 GB，解压 7.8 GB），用 GITHUB_TOKEN 直接下载，不绕过任何许可。
#
# 2) 为什么现在只出 debug 包
#    release / profile 需要 AOT，而 AOT 生成器（gen_snapshot.exe）必须与
#    libflutter.so 里的 Dart VM 严格同版本，否则产出「能装、一启动就 SIGSEGV」
#    的 HAP（报 VM snapshot invalid）。切到 3.44.9 之后两边都是 Dart 3.12.2，
#    理论上已经配套，但 release 还没在真机上验证；鸿蒙侧运行时依赖（MPV /
#    sherpa / tflite / QuickJS）也还没移植完，出 release 没有意义。debug 走
#    JIT，不需要 gen_snapshot，所以先稳定在 debug。等运行时移植完成、并在
#    真机上验过 AOT，把 HAP_BUILD_MODE 改成 release 即可。
#
# 3) 用 pubspec_ohos.yaml 而不是 pubspec.yaml
#    见该文件头部注释：鸿蒙 fork 自带 Dart 3.12.2，主干清单写的 ^3.13.4 解析不过；
#    同时要补 path_provider / file_selector / video_player / webview_flutter
#    四个平台实现包。清单里没列 lume_cat_node（iOS 专用 Node 宿主）。
#
# 4) 为什么仓库里带着 libsqlite3.so
#    package:sqlite3 3.x 走 Dart native assets，鸿蒙不在它的平台表里；清单里
#    把 hook 设成 source: system，运行期只做 dlopen("libsqlite3.so")。OpenHarmony
#    不对外暴露 sqlite，所以库由我们自己从 amalgamation 编（tool/build_sqlite_ohos.sh），
#    产物落在 ohos/entry/libs/<abi>/，hvigor 会打进 HAP 的 libs/<abi>/。
#    另外 fork 的 flutter_tools 在 ohos 上漏装 NativeAssetsManifest.json，
#    build 前要打 tool/patch_flutter_tools_ohos.py 这个补丁。
#
# 产物：未签名 HAP（--no-codesign）。安装要自己签名：
#   java -jar hap-sign-tool.jar sign-app ...  或用 DevEco 的自动签名。
name: Build HAP (HarmonyOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '目标架构'
        type: choice
        options: [arm64, x64, both]
        default: arm64
      analyze_only:
        description: '只跑静态检查，不出包'
        type: boolean
        default: false
  # 暂不接 push：鸿蒙侧运行时依赖（MPV / sherpa / tflite / QuickJS 移植）
  # 还没落地，每次 push 都跑 30 分钟的 HAP 构建没有额外信息量。
  # 运行时移植完成、流水线稳定后再打开下面这段：
  # push:
  #   branches: [main]
  #   paths:
  #     - 'lib/**'
  #     - 'ohos/**'
  #     - 'assets/**'
  #     - 'pubspec_ohos.yaml'
  #     - 'third_party/**'
  #     - '.github/workflows/build-harmonyos.yml'

permissions:
  contents: read

concurrency:
  group: ohos-${{ github.ref }}
  cancel-in-progress: true

run-name: Build HAP (HarmonyOS) — ${{ inputs.target || 'arm64' }}

jobs:
  build-hap:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # 鸿蒙 Flutter fork：必须选 **3.44.9 这一批**，不能跟着主干升到 3.47.9。
      # fork 只重建了 arm64 引擎；3.47.9-ohos-1.0.0 的 ohos-x64 引擎仍是 3.44.9
      # 时代的老货（Dart 3.12.2，kernel format 130），而它的定制 Dart SDK 是
      # 3.13.3（kernel 138）——模拟器是 x86_64，装上去 Dart 一行都跑不起来，
      # 日志里是 "Invalid kernel binary format version (expected 130, found 138)"，
      # 屏幕上就是一片白。3.44.9+ohos-0.0.1-canary1 的 Dart SDK、x64 引擎、
      # patched_sdk 全是 3.12.2，三者自洽，模拟器和真机都能跑。
      FLUTTER_OHOS_REF: 3.44.9+ohos-0.0.1-canary1
      # **必须与 workspace 同盘（D:）**：flutter-hvigor-plugin 用 path.relative
      # 算插件 srcPath，跨盘符会返回绝对路径，hvigor 直接报
      # "The srcPath is not a relative path: C:/.../integration_test/ohos"。
      # 依赖里带 integration_test（它的 ohos 模块就在 SDK 里），这条无法绕开。
      FLUTTER_OHOS_HOME: D:/fo/flutter_ohos
      # CLT 同样放 D 盘：分卷 2.6 GB + 解压 7.8 GB，C 盘只剩十几 GB 不够。
      HOS_SDK_HOME: D:/fo/command-line-tools/sdk
      DEVECO_SDK_HOME: D:/fo/command-line-tools/sdk
      # runner 在海外，用官方 pub.dev：国内镜像的 CDN 边缘节点偶尔返回与元数据
      # 哈希不一致的归档，pub 会以 "wrong content-hash" 失败，且每次命中的包随机。
      PUB_HOSTED_URL: https://pub.dev
      # 引擎 har / 定制 Dart SDK 走华为 OBS 与 atomgit Release，与 pub 无关。
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
      # 必须与 workspace 同盘：flutter-hvigor-plugin 用 path.relative 算插件
      # srcPath，Windows 上跨盘符会返回绝对路径，hvigor 直接报
      # "The srcPath is not a relative path"。
      PUB_CACHE: D:/pc
      # CLT 在 kiseding/koyze 的 Release 里；换仓库时改 vars.OHOS_TOOLCHAIN_REPO。
      TOOLCHAIN_TAG: toolchain-ohos-3.47.7
      HAP_BUILD_MODE: debug

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # CLT 2.6 GB，超过 Release 单文件 2 GB 上限，所以按 1.2 GB 分卷存。
      # 下载失败时 gh 会退出非 0，宁可在这里红，也别拖到 hvigor 才报缺 SDK。
      - name: 取华为命令行工具（分卷解压）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tc_repo="${{ vars.OHOS_TOOLCHAIN_REPO || 'kiseding/koyze' }}"
          mkdir -p /d/fo/dl
          gh release download "$TOOLCHAIN_TAG" --repo "$tc_repo" \
            --pattern 'command-line-tools-windows.zip.part*' --dir /d/fo/dl --clobber
          cd /d/fo/dl
          ls -lh
          cat command-line-tools-windows.zip.part* > clt.zip
          rm -f command-line-tools-windows.zip.part*
          # 用 7z 而不是 tar：windows-latest 自带 7-Zip，而 Git Bash 里的 tar
          # 不一定支持 zip 容器。CLT 单包解压后 7.8 GB，7z 也比 bsdtar 快。
          sevenzip="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          "$sevenzip" x -y clt.zip -o/d/fo > /dev/null
          rm -f clt.zip
          sdk_pkg="$HOS_SDK_HOME/default/sdk-pkg.json"
          if [ ! -f "$sdk_pkg" ]; then
            echo "::error::CLT 里没有 sdk/default/sdk-pkg.json，检查压缩包顶层目录名是否为 command-line-tools/"
            ls -la /d/fo
            exit 1
          fi
          api="$(grep -o '"apiVersion"[^,]*' "$sdk_pkg" | head -1 | grep -o '[0-9]\+')"
          echo "HarmonyOS SDK API: ${api:-unknown}"
          if [ -n "${api:-}" ] && [ "$api" -lt 26 ]; then
            echo "::error::SDK API $api 低于鸿蒙 Flutter fork 要求的 26"
            exit 1
          fi
          # CLT 自带 node / ohpm / hvigor，优先用自带的
          for d in tool/node node bin hvigor/bin ohpm/bin; do
            [ -d "/d/fo/command-line-tools/$d" ] && echo "D:/fo/command-line-tools/$d" >> "$GITHUB_PATH"
          done
          node --version || echo "::warning::CLT 自带 node 未进 PATH"

      # hvigor 需要 JDK；26.0.0 起推荐 21。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉鸿蒙 Flutter fork
        shell: bash
        run: |
          set -euo pipefail
          # 跨盘符会让 hvigor 报 "srcPath is not a relative path"（见 env 注释），
          # 与其等到出包阶段炸，不如在这里直接拦下。
          ws_drive="${GITHUB_WORKSPACE:0:1}"
          fl_drive="${FLUTTER_OHOS_HOME:0:1}"
          if [ "${ws_drive,,}" != "${fl_drive,,}" ]; then
            echo "::error::FLUTTER_OHOS_HOME($fl_drive:) 必须与 workspace($ws_drive:) 同盘"
            exit 1
          fi
          git clone --depth 1 -b "$FLUTTER_OHOS_REF" \
            https://atomgit.com/oh-flutter/flutter_flutter.git "$FLUTTER_OHOS_HOME"
          echo "flutter_ohos $FLUTTER_OHOS_REF -> $(git -C "$FLUTTER_OHOS_HOME" rev-parse HEAD)"

      # fork 的 ohos.dart 少写了一步：android/ios/linux 都会把 build hooks 产出的
      # NativeAssetsManifest.json 塞进 flutter_assets，只有 ohos 漏了。缺这个文件
      # Dart VM 不知道 libsqlite3.so 的存在，第一次 sqlite3.open() 就抛
      # "Failed to lookup symbol"。脚本幂等，并顺手删掉工具快照 stamp 强制重建。
      - name: 给 flutter_tools 打原生资源清单补丁
        shell: bash
        env:
          # 脚本里有中文输出，Windows 默认 cp1252 会让 print 抛异常。
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python tool/patch_flutter_tools_ohos.py "$FLUTTER_OHOS_HOME"

      # 首次调用会下载定制 Dart SDK（atomgit Release）并编译 flutter_tools。
      # 不做 URL 重写：fork 内的 dart-sdk-url.ohos 已经指向与本 tag 配套的工件。
      - name: 初始化工具链（定制 Dart SDK + 引擎 har）
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" --version
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" precache --ohos
          ls "$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"

      - name: 换入鸿蒙依赖清单并解析
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec_ohos.yaml pubspec.yaml
          # pubspec.lock 是给官方 SDK 生成的，里面没有 _ohos 包；不删会解析失败。
          rm -f pubspec.lock
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" pub get

      # 引擎与 patched_sdk 必须是同一个 Dart 版本，否则 debug 包也会在设备上
      # 报 "Unexpected Kernel Format Version"。
      - name: 校验工具链自洽
        shell: bash
        run: |
          set -euo pipefail
          engine="$FLUTTER_OHOS_HOME/bin/cache/artifacts/engine"
          dart_bin="$FLUTTER_OHOS_HOME/bin/cache/dart-sdk/bin/dart.exe"
          dart_version="$("$dart_bin" --version 2>&1 | tr -d '\r' | sed -n 's/^Dart SDK version: \([^ ]*\).*/\1/p')"
          test -n "$dart_version" || { echo "::error::无法读取 Dart SDK 版本"; exit 1; }
          echo "Dart SDK: $dart_version"
          echo "engine.ohos.har: $(tr -d '\r\n' < "$FLUTTER_OHOS_HOME/bin/internal/engine.ohos.har.version")"

          for arch in arm64 x64; do
            for mode in '' -profile -release; do
              test -f "$engine/ohos-$arch$mode/flutter.har" || {
                echo "::error::缺少 ohos-$arch$mode/flutter.har"
                exit 1
              }
            done
          done

          # patched_sdk 决定 debug 包的 kernel 格式，必须来自同一批次。
          # 注意它在 common/ 下，不在引擎 arch 目录里。
          test -f "$engine/common/flutter_patched_sdk/platform_strong.dill" || {
            echo "::error::precache 没拿到 flutter_patched_sdk"
            ls -R "$engine" | head -40
            exit 1
          }

          # 顺带把 AOT 生成器的版本记下来：debug 不用它，但日志里留着，
          # 将来要开 release 时一眼能看出是不是还是那份 3.12.2 的老货。
          snap="$engine/ohos-arm64-release/windows-x64/gen_snapshot.exe"
          if [ -f "$snap" ]; then
            "$snap" --version 2>&1 | tr -d '\r' | sed 's/^/  gen_snapshot: /'
          else
            echo "  gen_snapshot: 未下载（debug 构建不需要）"
          fi

      - name: 静态检查（鸿蒙 fork 的 API 面）
        if: ${{ inputs.analyze_only != true }}
        shell: bash
        run: |
          set -euo pipefail
          # fork 里 AlertDialog.scrollable 之类的类型与官方 3.47.5 有出入，
          # 这套检查能提前拦住「主干绿、鸿蒙红」的差异。
          "$FLUTTER_OHOS_HOME/bin/flutter.bat" analyze --no-fatal-infos

      - name: 构建 HAP
        if: ${{ inputs.analyze_only != true }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target || 'arm64' }}" in
            both)  targets="ohos-arm64 ohos-x64" ;;
            x64)   targets="ohos-x64" ;;
            *)     targets="ohos-arm64" ;;
          esac
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version="${version%%+*}"
          test -n "$version" || { echo "::error::读不到 pubspec 里的 version"; exit 1; }
          out="build/harmonyos-$HAP_BUILD_MODE"
          rm -rf "$out" && mkdir -p "$out"

          for target in $targets; do
            # Flutter/Hvigor 复用 build 目录，切架构前必须清干净，否则 HAP 里
            # 会混进上一个架构的 libapp.so / libflutter.so。
            #
            # **ohos/entry/libs 不能整个删**：里面躺着仓库自带的 libsqlite3.so
            # （见 workflow 头部第 4 条）。只清上一轮的 flutter 产物，再只保留
            # 本架构的 sqlite 库，避免 arm64 包里混进 x86_64 的 .so。
            rm -rf build/ohos ohos/entry/build ohos/har
            git checkout -- ohos/entry/libs 2>/dev/null || true
            case "$target" in
              ohos-arm64) keep=arm64-v8a; drop=x86_64 ;;
              ohos-x64)   keep=x86_64;    drop=arm64-v8a ;;
              *)          keep="";        drop="" ;;
            esac
            if [ -n "$drop" ]; then rm -rf "ohos/entry/libs/$drop"; fi
            if [ -n "$keep" ] && [ ! -f "ohos/entry/libs/$keep/libsqlite3.so" ]; then
              echo "::error::缺少 ohos/entry/libs/$keep/libsqlite3.so（用 tool/build_sqlite_ohos.sh 生成）"
              exit 1
            fi
            for abi in arm64-v8a x86_64; do
              rm -f "ohos/entry/libs/$abi/libflutter.so" \
                    "ohos/entry/libs/$abi/libapp.so" \
                    "ohos/entry/libs/$abi/libvmservice_snapshot.so"
            done
            set +e
            "$FLUTTER_OHOS_HOME/bin/flutter.bat" build hap \
              "--$HAP_BUILD_MODE" --no-codesign --target-platform "$target"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::$target 构建失败（exit $rc）"
              echo "--- ohos/entry/build 结构 ---"
              find ohos/entry/build -maxdepth 4 2>/dev/null | head -40 || true
              exit "$rc"
            fi
            # hvigor 把 HAP 同时写到 ohos/entry/build/default/outputs/default/
            # 和 build/ohos/hap/（同一份文件的两次落盘）。优先取前者，
            # 各目录内部再要求恰好一个，避免把「两个副本」误判成「两个产物」。
            pick=""
            for dir in ohos/entry/build build/ohos/hap; do
              [ -d "$dir" ] || continue
              mapfile -t found < <(find "$dir" -name '*.hap' -type f | sort)
              if [ "${#found[@]}" -gt 0 ]; then
                if [ "${#found[@]}" -ne 1 ]; then
                  echo "::error::$target 在 $dir 下应有恰好一个 HAP，实际 ${#found[@]} 个"
                  printf '%s\n' "${found[@]}"
                  exit 1
                fi
                pick="${found[0]}"
                break
              fi
            done
            if [ -z "$pick" ]; then
              echo "::error::$target 没有产出 HAP"
              find ohos/entry/build build/ohos/hap -maxdepth 5 2>/dev/null | head -40 || true
              exit 1
            fi
            dst="$out/LumeBox-${version}-${target}-unsigned.hap"
            cp "$pick" "$dst"
            echo "$target HAP："
            ls -lh "$dst"
          done

      - name: 校验 HAP 结构
        if: ${{ inputs.analyze_only != true }}
        shell: bash
        run: |
          set -euo pipefail
          out="build/harmonyos-$HAP_BUILD_MODE"
          count="$(find "$out" -maxdepth 1 -name '*.hap' -type f | wc -l)"
          test "$count" -ge 1 || { echo "::error::没有产出 HAP"; exit 1; }
          python - "$out" <<'PY'
          import sys, zipfile
          from pathlib import Path

          out = Path(sys.argv[1])
          for hap in sorted(out.glob('*.hap')):
              with zipfile.ZipFile(hap) as z:
                  names = z.namelist()
              has_ability = any(n.endswith('ets/modules.abc') or n.endswith('module.json') for n in names)
              flutter_libs = [n for n in names if n.endswith('libflutter.so')]
              app_libs = [n for n in names if n.endswith('libapp.so') or n.endswith('kernel_blob.bin')]
              print(f'{hap.name}: {hap.stat().st_size/1048576:.1f} MiB, '
                    f'module={"ok" if has_ability else "missing"}, '
                    f'libflutter={len(flutter_libs)}, dart_payload={len(app_libs)}')
              if not has_ability:
                  raise SystemExit(f'{hap.name} 缺 HAP 必需条目')
              if not flutter_libs:
                  raise SystemExit(f'{hap.name} 里没有 libflutter.so')
              if not app_libs:
                  raise SystemExit(f'{hap.name} 里既没有 libapp.so 也没有 kernel_blob.bin')
              # sqlite 是我们自带编译的（见 tool/build_sqlite_ohos.sh），
              # 少了库或者少了映射清单，装到设备上一打开就白屏卡启动页。
              sqlite_libs = [n for n in names if n.rsplit('/', 1)[-1] == 'libsqlite3.so']
              has_manifest = any(n.endswith('NativeAssetsManifest.json') for n in names)
              print(f'  sqlite={[n.rsplit("/", 1)[-2] + "/libsqlite3.so" for n in sqlite_libs] or "missing"}, '
                    f'native_assets_manifest={"ok" if has_manifest else "missing"}')
              if not sqlite_libs:
                  raise SystemExit(f'{hap.name} 里没有 libsqlite3.so')
              if not has_manifest:
                  raise SystemExit(f'{hap.name} 缺 NativeAssetsManifest.json')
          PY
          (cd "$out" && sha256sum ./*.hap | tee SHA256SUMS.harmonyos.txt)

      - name: 上传 HAP
        if: ${{ inputs.analyze_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: LumeBox-HarmonyOS-HAP
          path: build/harmonyos-${{ env.HAP_BUILD_MODE }}/*
          if-no-files-found: error
          retention-days: 7
