# 安卓分包构建：arm64-v8a / armeabi-v7a / x86_64 各出一个 APK。
#
# 为什么按 ABI 分开而不是一次 `--split-per-abi`：
# 三个 ABI 的原生依赖不一样（quickjs 走 NDK 现编，sherpa / media_kit / tflite
# 是预编译 .so），某个 ABI 缺库时不该把另外两个也拖红。分开跑还能并行，
# 出错时一眼看出是哪个 ABI 的问题。
#
# 触发：只在手动触发时构建（与 iOS 一致，避免私有仓库额度被自动构建吃掉）。
# 产物未做正式签名——release 用的是 debug key，只够装机自测，不能上架。
name: Build APK (Android)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        type: choice
        options: [release, debug]
        default: release

run-name: Build APK (Android) — ${{ inputs.build_type }}

jobs:
  build-apk:
    name: ${{ matrix.flavor }} (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    strategy:
      # 一个 ABI 挂了不影响另外两个出包：这里最需要的就是看到「谁挂了」。
      fail-fast: false
      matrix:
        include:
          # target-platform 是 Flutter 的写法，abi 是 Android 的 ABI 名。
          # 注意 Flutter 没有 32 位 x86 的发布目标：模拟器用的就是 x86_64。
          - abi: arm64-v8a
            target: android-arm64
            flavor: arm64
          - abi: armeabi-v7a
            target: android-arm
            flavor: arm32
          - abi: x86_64
            target: android-x64
            flavor: x64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # AGP 9 / Kotlin 2.4 要求 JDK 17 起。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定与开发机一致的版本（pubspec 要求 Dart ^3.13.4）；升级 Flutter 时同步改这里。
      - name: 安装 Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: 环境版本
        run: |
          flutter --version
          java -version

      - name: 拉取依赖
        run: flutter pub get --enforce-lockfile

      # pubspec 声明了 assets/models/intro/compact_checksums.json，那是脚本生成的
      # （仓库里只有校验清单），缺了打包会直接报「找不到资产」。这一步与 iOS 同源。
      - name: 准备并校验片头片尾本地模型
        run: python3 tool/prepare_intro_models.py

      # quickjs_engine 是本地 vendored 包，走 CMake 现编，需要 NDK。
      # 具体版本由 AGP 按 flutter.ndkVersion 决定并自动下载，这里只保证
      # 许可证已接受（否则自动下载会失败）。
      - name: 接受 Android SDK 许可证
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: 构建 ${{ matrix.flavor }}
        run: |
          flutter build apk \
            --${{ inputs.build_type }} \
            --target-platform ${{ matrix.target }}

      - name: 整理产物
        run: |
          mkdir -p out
          SRC=build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          test -f "$SRC"
          cp "$SRC" "out/LumeBox-${{ matrix.flavor }}-${{ inputs.build_type }}.apk"
          ls -lh out

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumeBox-apk-${{ matrix.flavor }}-${{ inputs.build_type }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
