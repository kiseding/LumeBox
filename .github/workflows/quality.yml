name: App quality checks (manual)
# 独立按需检查，不自动随推送、PR 或 iOS 构建运行。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis and complete regression suite with native source runtime
        shell: pwsh
        run: ./tool/check_quality.ps1 -PrepareNative
