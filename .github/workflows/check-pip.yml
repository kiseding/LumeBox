name: PiP native checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Check only production PiP Swift for iOS 18
        shell: bash
        run: |
          set -euo pipefail
          flutter precache --ios
          FLUTTER_ROOT=$(dirname "$(dirname "$(command -v flutter)")")
          FRAMEWORKS="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64_x86_64-simulator"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios18.0-simulator \
            -F "$FRAMEWORKS" ios/Runner/PipController.swift ios/Runner/PipFramePump.swift ios/Runner/MediaTrackProbe.swift
      - name: Check production AVPlayer output handoff without a simulator
        run: python3 tool/check_pip_av_handoff.py
